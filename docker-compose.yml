services:
  postgres:
    image: postgres:16
    container_name: threadbridge-postgres
    environment:
      POSTGRES_DB: threadbridge
      POSTGRES_USER: threadbridge_user
      POSTGRES_PASSWORD: threadbridge_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: